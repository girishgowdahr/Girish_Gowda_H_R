spring:
  datasource:
    url: jdbc:h2:mem:girish_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core
  flyway:
    enabled: true
    schemas:
      - core
      - portfolio
    default-schema: core
    locations:
      - classpath:db/migration/core
      - classpath:db/migration/portfolio
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
